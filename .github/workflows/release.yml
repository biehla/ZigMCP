name: Release

# AGENTS.md D9: release binaries are built with the pinned stable Zig (0.17.1),
# never master. Attaches binaries + the current index artifact and publishes
# client configuration snippets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the GitHub Release

jobs:
  release:
    name: Build and publish (pinned Zig)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1  # D9: pinned stable, never master
      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist/pkg/data
          bin="zig-out/bin/zigmcp"
          [ -f "$bin" ] || bin="zig-out/bin/zigmcp.exe"
          base="${bin##*/}"
          ext=""
          case "$base" in *.exe) ext=".exe" ;; esac
          # The binary loads data/advice at startup (D2): a release without the
          # corpus cannot start (CI-8). The tarball ships the two together, so
          # unpacking it into an empty directory is a working install.
          cp "$bin" "dist/pkg/$base"
          cp -r data/advice "dist/pkg/data/"
          # MIT: the tarball is a distribution, so it carries the license.
          cp LICENSE "dist/pkg/LICENSE"
          tar -C dist/pkg -czf "dist/zigmcp-${{ matrix.os }}.tar.gz" .
          # The raw binary stays for callers that point at their own corpus.
          cp "$bin" "dist/zigmcp-${{ matrix.os }}${ext}"
          # The canonical index asset is the rolling `index` release published by
          # index.yml (CI-2); attaching it here as well is only a convenience
          # for someone holding a version tag, so it stays conditional.
          if [ -f generated/index.jsonl ]; then cp generated/index.jsonl dist/; fi
      - name: Write the release notes
        shell: bash
        run: |
          # shellcheck disable=SC2016  # the backticks below are literal markdown
          # DOC-2: the client snippet lives in client-config.json, which the
          # readme embeds verbatim, so the release note cannot drift from it.
          {
            echo "## Client configuration"
            echo
            echo "### Claude Code / generic MCP client (stdio)"
            echo
            echo '```json'
            cat client-config.json
            echo '```'
            echo
            echo '> `zigmcp-<os>.tar.gz` contains the binary **and** `data/advice/`; unpack it'
            echo '> and run the binary from that directory (or set `ZIGMCP_ADVICE_DIR`). A'
            echo '> bare binary cannot start without the corpus.'
            echo
            echo '> The server resolves its index from `--index` / `ZIGMCP_INDEX` (a **local'
            echo '> path** or an HTTP(S) URL) and hot-reloads it; the index artifact attached'
            echo '> to this release is the file to point at. Without an index the server'
            echo '> still serves the advice corpus, and the doc tools report that nothing'
            echo '> matched.'
          } > release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
