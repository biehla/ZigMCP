name: Rebuild index

# AGENTS.md §8: after the bump PR merges, re-run the indexer over the merged
# pinned trees and publish generated/index.jsonl (sorted by (project, symbol)).
# Degrade-don't-skip (AGENTS.md): a file with parse diagnostics still
# contributes usable records and is reported as degraded — never fail the run.
#
# The trigger is the merge itself: a push to main that changes the pins.
# `workflow_run` on the bump workflow would fire when the PR is *opened*,
# before the new pins are on main, so it would publish the old index.
on:
  push:
    branches: [main]
    paths:
      - data/sources.zon
  workflow_dispatch:

permissions:
  # Writing is required to publish the rolling `index` release asset that the
  # bump and rebuild baselines download (CI-2).
  contents: write
  actions: read

jobs:
  index:
    name: Index pinned trees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Plan the fetch (parse data/sources.zon)
        run: |
          mkdir -p upstream generated
          # One parser for both workflows (CI-4/CI-5): every include and
          # exclude, `|`-separated, from the ZON AST rather than a regex.
          zig build plan-sources > upstream/plan.tsv
          cat upstream/plan.tsv

      - name: Fetch the pinned upstream trees
        run: |
          while IFS='|' read -r name repo _branch commit _includes _excludes; do
            echo "fetching $name @ $commit"
            # CI-7: fetch just the pinned commit, not the branch's history.
            git init -q "upstream/$name"
            git -C "upstream/$name" remote add origin "$repo"
            git -C "upstream/$name" fetch -q --depth 1 origin "$commit"
            git -C "upstream/$name" checkout -q --detach FETCH_HEAD
          done < upstream/plan.tsv

      - name: Download the published index (the previous version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # AGENTS.md §8: a project whose commit is unchanged is skipped entirely
          # and its records are carried over from the published index. The
          # baseline is the `index` release tag; on the very first run that
          # release does not exist yet, the download fails, and the index is
          # rebuilt from scratch — which is what publishes it.
          gh release download index --pattern index.jsonl --dir published 2>/dev/null || true
          if [ -f published/index.jsonl ]; then
            cp published/index.jsonl previous.jsonl
            echo "previous index available"
          else
            echo "no published index: rebuilding every project"
          fi

      - name: Build the index (degrade-don't-skip)
        run: |
          : > generated/index.jsonl
          : > generated/index.status.json
          while IFS='|' read -r name _repo _branch commit includes excludes; do
            # The indexer never fails the run because one upstream file is
            # broken: its usable records are still emitted and the file is
            # reported as degraded in the status sidecar.
            args=(--out "generated/$name.jsonl" --status "generated/$name.status.json"
                  --source "$name=$commit=upstream/$name")
            # `read -ra` splits without pathname expansion, so `**` survives.
            incs=()
            if [ -n "$includes" ]; then IFS=' ' read -ra incs <<< "$includes"; fi
            for inc in "${incs[@]}"; do args+=(--include "$inc"); done
            excs=()
            if [ -n "$excludes" ]; then IFS=' ' read -ra excs <<< "$excludes"; fi
            for exc in "${excs[@]}"; do args+=(--exclude "$exc"); done
            if [ -f previous.jsonl ]; then
              zig run tools/indexer.zig -- "${args[@]}" --previous previous.jsonl || true
            else
              zig run tools/indexer.zig -- "${args[@]}" || true
            fi
          done < upstream/plan.tsv

      - name: Merge and sort the index
        run: |
          python3 - <<'PY'
          import json, pathlib
          records = []
          for path in sorted(pathlib.Path("generated").glob("*.jsonl")):
              for line in path.read_text().splitlines():
                  if line.strip():
                      records.append(json.loads(line))
          # Canonical order: (project, symbol), ties by (path, line) — the same
          # order the indexer itself emits.
          records.sort(key=lambda r: (r["project"], r["symbol"], r["path"], r["line"]))
          out = pathlib.Path("generated/index.jsonl")
          out.write_text("".join(
              json.dumps(r, separators=(",", ":"), ensure_ascii=False) + "\n"
              for r in records))
          print(f"{len(records)} records")
          PY
          test -s generated/index.jsonl

      - name: Merge the status sidecars
        run: |
          python3 - <<'PY'
          import json, pathlib
          projects = {}
          for path in sorted(pathlib.Path("generated").glob("*.status.json")):
              data = json.loads(path.read_text())
              for name, status in data.get("projects", {}).items():
                  projects[name] = status
          pathlib.Path("generated/index.status.json").write_text(
              json.dumps({"projects": projects}, separators=(",", ":")))
          print(json.dumps(projects, indent=2)[:2000])
          PY

      - name: Publish index artifact
        uses: actions/upload-artifact@v6
        with:
          name: index
          path: generated/
          if-no-files-found: error

      - name: Publish the rolling index release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One documented tag, `index`, is the artifact every baseline reads
          # (AGENTS.md §8). It is a prerelease so it never becomes "latest" and
          # never competes with a version tag from release.yml.
          gh release view index >/dev/null 2>&1 || \
            gh release create index \
              --title "Doc index (rolling)" \
              --notes "Rolling doc index published by index.yml; read by the bump and rebuild baselines." \
              --prerelease
          gh release upload index generated/index.jsonl --clobber
