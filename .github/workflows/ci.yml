name: CI

# AGENTS.md D9: pinned stable Zig (0.17.1) is the release toolchain and
# blocks merges; the master (nightly) leg is a non-publishing canary that
# only surfaces breakage early (continue-on-error, never blocks).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    name: Release (pinned Zig ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Fetch dependencies
        run: zig build --fetch=all
      - name: Build and test
        run: zig build test
      - name: Format check
        # The indexer fixture tree contains a deliberately unparseable file and
        # a warning-only file, so it is excluded from the formatter gate.
        run: zig fmt --check . --exclude tests/fixtures
      - name: Validate the advice corpus
        # CI-3: without this step an invalid corpus (a dangling Sxx/Pxx id, a
        # missing evidence label) merges green and only fails at run time.
        run: zig build check
      - name: Backlog regression tests
        run: zig build test-regressions
      - name: Workflow trigger/expression consistency
        # CI-1: actionlint accepts an event payload reference the declared
        # triggers cannot produce; this does not.
        run: zig build workflows
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Lint the workflows
        # Pinned to the version AGENTS.md §10 documents, so the local gate and
        # this step run the same linter.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  canary:
    name: Canary (Zig master)
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking canary; failure never blocks a merge
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - name: Build and test
        run: zig build test
      - name: Format check
        # The indexer fixture tree contains a deliberately unparseable file and
        # a warning-only file, so it is excluded from the formatter gate.
        run: zig fmt --check . --exclude tests/fixtures
      - name: Validate the advice corpus
        # CI-3: without this step an invalid corpus (a dangling Sxx/Pxx id, a
        # missing evidence label) merges green and only fails at run time.
        run: zig build check
      - name: Backlog regression tests
        run: zig build test-regressions
      - name: Workflow trigger/expression consistency
        # CI-1: actionlint accepts an event payload reference the declared
        # triggers cannot produce; this does not.
        run: zig build workflows
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Lint the workflows
        # Pinned to the version AGENTS.md §10 documents, so the local gate and
        # this step run the same linter.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
